[project]
name = "trafficcontrol-backend"
version = "0.1.0"
description = "Hermes-Trafficcontrol Backend (FastAPI)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",      # Alembic sync migrations
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "redis>=5.2.0",
    "websockets>=13.1",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",   # nur für später, nicht in Phase 1 aktiv
    "reportlab>=4.2.0",                    # PDF-Export in Reports
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
