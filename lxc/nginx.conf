# Hermes-Trafficcontrol — nginx vhost (HTTP-only, LAN-Test)
# Q5: HTTP ohne HTTPS, später trivial erweiterbar
#
# Backend läuft auf 127.0.0.1:7890 (siehe traffic-backend.service)
# Frontend ist statisch unter /opt/trafficcontrol/src/frontend/dist/ gebaut

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Logs
    access_log /var/log/nginx/trafficcontrol.access.log;
    error_log  /var/log/nginx/trafficcontrol.error.log;

    # Frontend-Static (Vite-Build)
    root /opt/trafficcontrol/src/frontend/dist;
    index index.html;

    # Cache-Header fürs Frontend
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Proxy → FastAPI
    # Wichtig: trailing slash! Sonst macht nginx ein 301-Redirect, was CORS bricht.
    location /api/ {
        proxy_pass http://127.0.0.1:7890/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MJPEG-Stream braucht lange Timeouts + buffering aus
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:7890/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;  # 1 Tag, hält WS offen
    }

    # Backend-Docs erreichbar (nützlich für Dev)
    location = /docs {
        proxy_pass http://127.0.0.1:7890/docs;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:7890/openapi.json;
    }
}
